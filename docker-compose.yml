# One-command deploy. Copy .env.example to .env, fill it in, then:
#   docker compose up --build -d
# The app is served at http://localhost:8787 (API + frontend, same origin).
services:
  skillmap:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: /api
    ports:
      - "${PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8787}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    restart: unless-stopped
